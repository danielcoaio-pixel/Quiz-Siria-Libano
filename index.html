<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz da Síria & Líbano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="container-quiz">
        
        <!-- O JavaScript vai injetar a pergunta atual aqui dentro -->
        <div id="container-perguntas"></div>

        <!-- TELA DE RESULTADOS -->
        <div class="tela-resultado bloco-pergunta" id="tela-resultado">
            <div class="texto-pergunta">Fim do Quiz!</div>
            <p style="color: var(--cor-neutra); font-weight: bold; font-size: 20px;">Você completou as 10 perguntas.</p>
            <div class="pontuacao-resultado">Acertos: <strong id="acertos">0</strong> de 10</div>
            <button class="botao-reiniciar" onclick="reiniciarQuiz()">Tentar Novamente</button>
        </div>

    </div>

    <script src="quiz.js"></script>
</body>
</html>
